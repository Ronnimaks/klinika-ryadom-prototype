<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="Onest, Segoe UI, sans-serif">
  <!-- Схема района в стиле сайта (для примера, не настоящая карта). Настоящий адрес - после выбора ТЦ. -->
  <rect width="800" height="550" fill="#0B191B"/>
  <!-- парк и пруд -->
  <path d="M520 40 C600 30 700 60 760 120 L780 260 C700 280 620 250 560 210 C520 170 500 100 520 40Z" fill="#11262A"/>
  <ellipse cx="660" cy="150" rx="52" ry="30" fill="#0E2023" stroke="#1C3539"/>
  <!-- кварталы -->
  <g fill="#122226">
    <rect x="40" y="40" width="150" height="110" rx="3"/><rect x="220" y="40" width="120" height="110" rx="3"/>
    <rect x="370" y="40" width="120" height="70" rx="3"/><rect x="40" y="180" width="150" height="120" rx="3"/>
    <rect x="40" y="330" width="150" height="170" rx="3"/><rect x="220" y="330" width="120" height="80" rx="3"/>
    <rect x="220" y="430" width="120" height="80" rx="3"/><rect x="560" y="330" width="200" height="80" rx="3"/>
    <rect x="560" y="430" width="200" height="80" rx="3"/><rect x="420" y="430" width="110" height="80" rx="3"/>
  </g>
  <!-- улицы -->
  <g stroke="#26404A" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M0 165 H800"/><path d="M205 0 V550"/><path d="M0 315 C200 312 420 300 800 292"/>
  </g>
  <g stroke="#1D343B" stroke-width="7" fill="none">
    <path d="M355 0 V550"/><path d="M545 165 V550"/><path d="M0 420 H545"/><path d="M355 120 H520"/>
  </g>
  <!-- линия метро -->
  <path d="M0 250 C140 255 260 245 400 240 S640 220 800 230" stroke="#3C6E8C" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <g transform="translate(300 244)">
    <circle r="15" fill="#0B191B" stroke="#6FA6C8" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-size="15" font-weight="600" fill="#6FA6C8">М</text>
  </g>
  <text x="300" y="282" text-anchor="middle" font-size="13" fill="#93A7A6">от метро пешком</text>
  <!-- путь от метро -->
  <path d="M315 244 C350 250 380 270 420 285" stroke="#E9B56F" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" fill="none"/>
  <!-- клиника -->
  <rect x="370" y="330" width="160" height="80" rx="3" fill="#1A2F33" stroke="#E9B56F" stroke-opacity=".5"/>
  <g transform="translate(450 300)">
    <circle r="26" fill="#E9B56F" fill-opacity=".14"/>
    <circle r="11" fill="#E9B56F"/>
    <circle r="4" fill="#16120A"/>
  </g>
  <text x="450" y="380" text-anchor="middle" font-size="18" fill="#EDF2EE">ИНДИВИТА</text>
  <text x="450" y="399" text-anchor="middle" font-size="12" fill="#93A7A6">ТЦ, 2 этаж · ночью вход с торца</text>
  <text x="660" y="105" text-anchor="middle" font-size="12" fill="#6F8584">парк</text>
</svg>
